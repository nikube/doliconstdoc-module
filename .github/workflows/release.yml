name: Release zip

# Two triggers (same convention as the other nikube modules, e.g. DMM):
#   - tag push (v*.*.*) -> attach the zip to a GitHub Release
#   - manual run        -> just upload the zip as a build artifact
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          # Tag push wins (strip leading 'v'), else fall back to the version
          # declared in the module descriptor so manual runs still produce a
          # sensibly-named zip.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -oP "this->version\s*=\s*'\K[^']+" \
              core/modules/modDoliConstDoc.class.php)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zipname=module_doliconstdoc-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Sanity-check descriptor version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          DESC_VERSION=$(grep -oP "this->version\s*=\s*'\K[^']+" \
            core/modules/modDoliConstDoc.class.php)
          if [[ "${DESC_VERSION}" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::Tag is v${{ steps.ver.outputs.version }} but descriptor says ${DESC_VERSION}"
            exit 1
          fi

      - name: Lint PHP
        run: |
          find . -path ./.git -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l -d display_errors=1

      - name: Build zip
        run: |
          # Dolibarr's ?mode=deploy expects module_<name>-<X.Y.Z>.zip with a
          # single top-level dir matching <name>. The module lives at the repo
          # root here, so stage it into doliconstdoc/ first. dmm.json, the dev
          # scripts and repo metadata are not shipped in the zip.
          mkdir -p /tmp/stage/doliconstdoc
          rsync -a --exclude='.git*' --exclude='.github' \
            --exclude='dmm.json' --exclude='scripts' \
            --exclude='*.zip' --exclude='*.swp' --exclude='.DS_Store' \
            ./ /tmp/stage/doliconstdoc/
          cd /tmp/stage
          zip -r "${GITHUB_WORKSPACE}/${{ steps.ver.outputs.zipname }}" doliconstdoc

      - name: Verify zip layout
        run: |
          # Fail-fast if the zip would be rejected by Dolibarr (must contain
          # core/modules/mod*.class.php and the embedded doc data under the
          # expected top-level folder).
          unzip -l "${{ steps.ver.outputs.zipname }}" | head -20
          unzip -p "${{ steps.ver.outputs.zipname }}" \
            doliconstdoc/core/modules/modDoliConstDoc.class.php > /dev/null
          unzip -p "${{ steps.ver.outputs.zipname }}" \
            doliconstdoc/data/doliconstdoc.sql | head -1

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.zipname }}
          path: ${{ steps.ver.outputs.zipname }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.zipname }}
          generate_release_notes: true
          fail_on_unmatched_files: true
